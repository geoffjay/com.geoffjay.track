name: tracking
description: "Mobile client for the com.geoffjay.track personal health and fitness API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Persistent key-value storage for the API token and server URL.
  shared_preferences: ^2.5.1
  # RFC3339 timestamp encoding for the API (no intl dependency).
  http: ^1.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true